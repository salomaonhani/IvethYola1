<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração | Iveth & Yola</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            <div class="logo">I <span>&</span> Y</div>

            <p class="eyebrow">ÁREA RESTRITA</p>
            <h1>Bem-vindo de volta</h1>
            <p class="description">Gestão privada do casamento Iveth & Yola.</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="O teu email" required>

                <label for="password">Palavra-passe</label>
                <input id="password" type="password" placeholder="A tua palavra-passe" required>

                <p id="loginError" class="error"></p>

                <button type="submit" id="loginButton">ENTRAR NO PAINEL</button>
            </form>

            <a href="/" class="back-link">← Voltar ao convite</a>
            <footer>IVETH & YOLA · ADMINISTRAÇÃO</footer>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
